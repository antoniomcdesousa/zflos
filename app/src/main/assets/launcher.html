<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZFLOS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:#10151c;color:#e8edf3;min-height:100vh}
header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #243040}
header h1{font-size:20px;margin:0;flex:1}
button{font:inherit;background:#2b6cb0;color:#fff;border:0;border-radius:10px;padding:12px 16px}
button.alt{background:#2a3442}
#home{padding:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:20px;margin-top:8px}
.app{text-align:center;position:relative;user-select:none}
.app img,.app .ph{width:68px;height:68px;border-radius:16px;object-fit:cover;background:#2a3442;display:block;margin:0 auto 6px}
.app .ph{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.app small{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .x{position:absolute;top:-8px;right:4px;background:#8b2d2d;border-radius:50%;width:28px;height:28px;padding:0;font-size:15px;display:none}
body.edit .app .x{display:block}
#empty{color:#8a98a8;margin:30px 0;line-height:1.5}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#243040;padding:12px 18px;border-radius:12px;display:none;max-width:90vw;white-space:pre-wrap;text-align:center}
#ver{color:#5d6b7b;font-size:12px;text-align:center;margin-top:40px}
</style></head><body>
<header><h1>ZFLOS</h1><button class="alt" id="edit">Edit</button><button id="add">Add package</button></header>
<div id="home"><div id="grid"></div><div id="empty" style="display:none">No packages yet.<br>Tap <b>Add package</b> and pick a .zfl file.</div><div id="ver"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function render(){
  const g=$('#grid');g.innerHTML='';
  let list=[];try{list=JSON.parse(Host.list())}catch(e){}
  $('#empty').style.display=list.length?'none':'block';
  list.forEach(m=>{
    const d=document.createElement('div');d.className='app';
    let ic;
    if(m.icon){ic=document.createElement('img');ic.src=m.icon;ic.alt=''}
    else{ic=document.createElement('div');ic.className='ph';ic.textContent=(m.name||'?')[0].toUpperCase()}
    const sm=document.createElement('small');sm.textContent=m.name;
    const x=document.createElement('button');x.className='x';x.textContent='\u2715';
    x.onclick=e=>{e.stopPropagation();if(confirm('Remove '+m.name+' and its data?')){Host.remove(m.id);render();toast('Removed '+m.name)}};
    d.append(ic,sm,x);
    d.onclick=()=>{if(!document.body.classList.contains('edit'))Host.open(m.id)};
    g.append(d);
  });
  $('#ver').textContent='ZFLOS host version '+Host.version();
}
function refresh(msg){render();if(msg)toast(msg)}
$('#edit').onclick=()=>document.body.classList.toggle('edit');
$('#add').onclick=()=>Host.add();
render();
</script></body></html>
